<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Receipt body with rounded modern look -->
  <path d="M 50 40 L 150 40 Q 158 40 158 48 L 158 145 L 145 138 L 132 145 L 119 138 L 106 145 L 93 138 L 80 145 L 67 138 L 54 145 L 50 138 L 50 48 Q 50 40 58 40 Z" 
        fill="#FFFFFF" 
        stroke="#0F6E56" 
        stroke-width="4" 
        stroke-linejoin="round"/>
  
  <!-- Top accent strip (header) -->
  <path d="M 58 40 L 150 40 Q 158 40 158 48 L 158 58 L 50 58 L 50 48 Q 50 40 58 40 Z" 
        fill="#0F6E56"/>
  
  <!-- Item lines -->
  <line x1="62" y1="76" x2="120" y2="76" stroke="#888780" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="89" x2="135" y2="89" stroke="#888780" stroke-width="3" stroke-linecap="round"/>
  <line x1="62" y1="102" x2="115" y2="102" stroke="#888780" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Split arrows from center -->
  <line x1="104" y1="120" x2="74" y2="148" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="120" x2="104" y2="148" stroke="#EF9F27" stroke-width="3" stroke-linecap="round"/>
  <line x1="104" y1="120" x2="134" y2="148" stroke="#D85A30" stroke-width="3" stroke-linecap="round"/>
  
  <!-- People dots -->
  <circle cx="74" cy="158" r="11" fill="#1D9E75"/>
  <circle cx="74" cy="155" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  
  <circle cx="104" cy="158" r="11" fill="#EF9F27"/>
  <circle cx="104" cy="155" r="3.5" fill="#FFFFFF" opacity="0.4"/>
  
  <circle cx="134" cy="158" r="11" fill="#D85A30"/>
  <circle cx="134" cy="155" r="3.5" fill="#FFFFFF" opacity="0.4"/>
</svg>
