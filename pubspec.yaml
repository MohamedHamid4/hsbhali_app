name: hsbhali_app
description:  قسم فواتير اكلك انت وصحابك بسهولة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.0

  # Functional Programming
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_screenutil: ^5.9.0
  flutter_animate: ^4.5.0
  phosphor_flutter: ^2.0.0
  flutter_svg: ^2.0.10

  # Navigation
  go_router: ^14.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.4.0

  # Camera & Permissions
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

  # Image processing & paths
  image: ^4.1.7
  path_provider: ^2.1.2
  path: ^1.9.0

  # AI / Gemini
  google_generative_ai: ^0.4.6

  # Sharing
  share_plus: ^10.0.2
  screenshot: ^3.0.0
  gal: ^2.3.0

  # URL launcher (for WhatsApp deep-link)
  url_launcher: ^6.3.0

  # Charts (for monthly insights)
  fl_chart: ^0.69.0

  # AdMob
  google_mobile_ads: ^5.2.0

  # In-App Purchases (Remove Ads)
  in_app_purchase: ^3.2.0

  # Native splash screen (cold-start)
  flutter_native_splash: ^2.4.1

  # Performance / images
  cached_network_image: ^3.4.1
  flutter_image_compress: ^2.3.0
  package_info_plus: ^8.1.0

  # Firebase (graceful — app works without config)
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.0

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/logo/

# ─── flutter_launcher_icons config ─────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

  # Adaptive icon for Android
  adaptive_icon_background: "#0F6E56"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  web:
    generate: false

# ─── flutter_native_splash config ──────────────────────────
flutter_native_splash:
  color: "#0F6E56"
  color_dark: "#04342C"

  image: "assets/icons/splash_logo_padded.png"
  image_dark: "assets/icons/splash_logo_padded.png"

  android: true
  ios: true
  web: false

  android_gravity: center
  ios_content_mode: center

  android_12:
    color: "#0F6E56"
    color_dark: "#04342C"
    image: "assets/icons/splash_logo_padded.png"
    image_dark: "assets/icons/splash_logo_padded.png"
    icon_background_color: "#0F6E56"
    icon_background_color_dark: "#04342C"

  fullscreen: false
